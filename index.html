<!doctype html>
<html lang="uz">

<style>
:root{--bg:#FFF6E5;--ink:#1F2A44;--mut:#6B7390;--line:#EADFCB;--ona:#FF6B5E;--mat:#3D7BF7;--tab:#2DB67D;--ing:#8B5CF6;--rus:#12A8B5;--man:#F59E0B;--ok:#2DB67D;--bad:#FF8A3D;--c:var(--ona)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);font-weight:700}
#app{max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.scr{flex:1;display:flex;flex-direction:column;min-height:0;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:18px;min-height:44px}
.chip{background:#fff;border:2px solid var(--line);border-radius:99px;padding:6px 14px}
/* home */
.hi{display:flex;align-items:flex-end;gap:10px;margin:10px 0 14px}
.bunny{font-size:76px;line-height:1;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
.bub{background:#fff;border:2px solid var(--line);border-radius:22px 22px 22px 4px;padding:12px 16px;font-size:19px;line-height:1.3;font-weight:800;flex:1}
.bub.c{border-radius:22px;text-align:center}
.shelf{display:flex;gap:6px;align-items:center;margin-bottom:12px;font-size:13px;color:var(--mut)}
.shelf i{font-style:normal;font-size:24px;filter:grayscale(1);opacity:.3}
.shelf i.on{filter:none;opacity:1}
.big{display:block;width:100%;background:var(--ona);color:#fff;border-radius:26px;padding:20px 12px;font-size:25px;font-weight:900;box-shadow:0 7px 0 #D94A3E;transition:transform .08s,box-shadow .08s}
.big small{display:block;font-size:15px;font-weight:700;opacity:.92;margin-top:2px}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 #D94A3E}
.big.g{background:var(--ok);box-shadow:0 7px 0 #1F8E60}.big.g:active{box-shadow:0 2px 0 #1F8E60}
.big.w{background:#fff;color:var(--ink);box-shadow:0 7px 0 var(--line);border:2px solid var(--line)}
.sub{font-size:15px;color:var(--mut);margin:18px 2px 8px;font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--c);color:#fff;border-radius:22px;padding:14px 4px 10px;font-size:34px;line-height:1.1;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.tile span{display:block;font-size:14px;font-weight:900;margin-top:4px}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.grow{flex:1}
.par{font-size:13px;color:var(--mut);text-align:center;padding:10px;font-weight:700}
/* list */
.list{overflow:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.row{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--line);border-left:8px solid var(--c);border-radius:20px;padding:12px 14px;text-align:left;width:100%}
.row b{font-size:36px}.row div{flex:1;font-size:19px;font-weight:900}.row small{display:block;font-size:13px;color:var(--mut);font-weight:700}
.back{font-size:26px;width:48px;height:48px;border-radius:50%;background:#fff;border:2px solid var(--line)}
/* game */
.dots{display:flex;gap:6px}.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--ok)}.dots i.cur{background:var(--c)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;text-align:center;padding:6px 0}
.pic{font-size:96px;line-height:1.15}
.pic.m{font-size:30px;line-height:1.25;letter-spacing:2px;max-width:340px;word-break:break-all}
.pic.s{font-size:20px;line-height:1.2;letter-spacing:1px;max-width:330px;word-break:break-all}
.bigt{font-size:54px;font-weight:900;line-height:1.15;letter-spacing:1px}
.bigt.w{font-size:42px}
.bigt.sm{font-size:26px;line-height:1.3;padding:0 6px}
.ask{font-size:21px;font-weight:800;margin-top:8px;padding:0 6px;line-height:1.25}
.say{font-size:26px;width:52px;height:52px;border-radius:50%;background:#fff;border:2px solid var(--line);margin-top:8px}
.cells{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.cell{min-width:46px;height:56px;padding:0 8px;border-radius:14px;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900}
.cell.q{background:var(--c);color:#fff;border-color:var(--c)}
.cell.e{border-style:dashed;color:transparent}
.groups{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:350px;margin-bottom:6px}
.groups div{background:#fff;border:2px solid var(--line);border-radius:14px;padding:4px 8px;font-size:22px;letter-spacing:1px}
.opts{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.opts.c1{grid-template-columns:1fr}.opts.c3{grid-template-columns:repeat(3,1fr)}
.opt{background:#fff;border:2px solid var(--line);border-radius:22px;min-height:76px;padding:8px;font-size:38px;font-weight:900;box-shadow:0 5px 0 var(--line);display:flex;align-items:center;justify-content:center;line-height:1.1;transition:transform .08s}
.opt.t{font-size:26px}.opt.e{font-size:50px}
.opt:active{transform:translateY(3px)}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 5px 0 #1F8E60;animation:pop .35s}
.opt.no{background:#FFE3D1;border-color:var(--bad);box-shadow:0 5px 0 var(--bad);animation:shake .35s}
.opt.dim{opacity:.35}
@keyframes pop{50%{transform:scale(1.07)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.opt svg{width:58px;height:58px}
.hint{min-height:30px;font-size:18px;font-weight:800;color:var(--bad);text-align:center;margin:6px 0}
.hint.g{color:var(--ok)}
/* memory */
.mem{display:grid;gap:10px;width:100%;grid-template-columns:repeat(3,1fr)}
.mem.c4{grid-template-columns:repeat(4,1fr)}
.card{aspect-ratio:1;border-radius:18px;background:var(--c);box-shadow:0 5px 0 rgba(0,0,0,.18);font-size:40px;font-weight:900;color:transparent;display:flex;align-items:center;justify-content:center;overflow:hidden;line-height:1}
.card.t{font-size:19px}.card.d{font-size:15px;letter-spacing:1px;padding:4px;word-break:break-all;line-height:1.1}
.card:not(.up):not(.done){font-size:0}
.card.up{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.card.done{background:#E4F6EE;color:var(--ink);border:2px solid var(--ok);box-shadow:none}
/* result */
.res{align-items:center;justify-content:center;text-align:center;gap:10px}
.stars{font-size:60px;letter-spacing:6px}.stars i{font-style:normal;opacity:.2;filter:grayscale(1)}.stars i.on{opacity:1;filter:none;display:inline-block;animation:pop .5s backwards}
.stars i.on:nth-child(2){animation-delay:.2s}.stars i.on:nth-child(3){animation-delay:.4s}
.h1{font-size:36px;font-weight:900;color:var(--ona)}
.res .big{margin-top:10px}
.res .bub{flex:none;width:100%}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.conf i{position:absolute;top:-30px;font-style:normal;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
/* parent */
.pr{overflow:auto;font-weight:700;font-size:15px}
.pr h2{font-size:18px;font-weight:900;margin:16px 0 8px}
.pr .box{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.week{display:flex;gap:6px;align-items:flex-end;height:90px}
.week div{flex:1;text-align:center;font-size:11px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.week i{display:block;background:var(--mat);border-radius:6px 6px 0 0;min-height:3px}
.kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}
.kv b{font-weight:900}
.tag{display:inline-block;background:#FFE9E6;color:#D94A3E;border-radius:10px;padding:4px 10px;margin:3px;font-weight:900}
.pr input{font:inherit;border:2px solid var(--line);border-radius:12px;padding:8px 12px;width:100%;user-select:text;-webkit-user-select:text}
.lnk{color:#D94A3E;text-decoration:underline;padding:14px;font-size:14px}
</style>
</head>

function list(f){
 app.innerHTML=`<div class="scr" style="--c:var(--${f})"><div class="top"><button class="back" id="bk">←</button><span style="font-size:22px">${FAN[f][1]} ${FAN[f][0]}</span><span style="width:48px"></span></div>
 <div class="list" style="margin-top:12px">${G.filter(g=>g.fan===f).map(g=>`<button class="row" data-g="${g.id}"><b>${g.e}</b><div>${esc(g.n)}<small>${level(g)}-bosqich · ${g.lv} tadan</small></div></button>`).join("")}</div></div>`;
 $("#bk").onclick=home;app.querySelectorAll(".row").forEach(b=>b.onclick=()=>{fx.tap();play(b.dataset.g)});
}

/* ---------- o'yin raundi ---------- */
function play(gid){
 const g=GM[gid],L=level(g),used=new Set();
 if(g.memory)return memory(g,L);
 const queue=[];for(let i=0;i<CFG.round;i++){const it=pickItem(g,L,used);used.add(it.id);queue.push({it,first:true})}
 let pos=0,miss=0,total=queue.length;const wrong=[];
 const next=()=>{if(pos>=queue.length)return result(g,L,miss,total,wrong);ask(queue[pos])};
 function ask(cur){
  const q=g.make(cur.it,L);
  const head=`<div class="top"><button class="back" id="x">✕</button><div class="dots">${Array.from({length:total},(_,i)=>`<i class="${i<total-(queue.length-pos)?"on":i===total-(queue.length-pos)?"cur":""}"></i>`).join("")}</div><span style="width:48px;text-align:center;font-size:26px">${g.e}</span></div>`;
  const stage=`<div class="stage">${q.html||""}${q.pic?`<div class="pic ${q.picCls||""}">${q.pic}</div>`:""}${q.big!==undefined?`<div class="bigt ${q.bigCls||""}">${q.big}</div>`:""}
   <div class="ask">${esc(q.q)}</div>${q.say&&canSay()?`<button class="say" id="say">🔊</button>`:""}<div id="slots"></div></div><div class="hint" id="hint"></div>`;
  if(q.type==="build"){
   app.innerHTML=`<div class="scr" style="--c:var(--${g.fan})">${head}${stage}<div class="opts ${q.wide?"":"c3"}" id="opts"></div></div>`;
   const slots=[],sl=$("#slots"),op=$("#opts");let lock=false;
   const draw=()=>{sl.innerHTML=`<div class="cells">${q.answer.map((_,i)=>`<span class="cell${slots[i]?"":" e"}" data-i="${i}">${slots[i]?esc(slots[i].p):"·"}</span>`).join("")}</div>`;
    sl.querySelectorAll(".cell").forEach(c=>c.onclick=()=>{if(lock)return;const i=+c.dataset.i;if(slots[i]){slots[i].b.classList.remove("dim");slots.splice(i,1);draw()}})};
   q.parts.forEach(p=>{const b=document.createElement("button");b.className="opt"+(q.wide?" t":"");b.textContent=p;op.appendChild(b);
    b.onclick=()=>{if(lock||b.classList.contains("dim")||slots.length>=q.answer.length)return;fx.tap();slots.push({p,b});b.classList.add("dim");draw();
     if(slots.length===q.answer.length){lock=true;const ok=slots.every((s,i)=>s.p===q.answer[i]);finish(ok,()=>{
       sl.innerHTML=`<div class="cells">${q.answer.map(x=>`<span class="cell q">${esc(x)}</span>`).join("")}</div>`})}}});
   draw();
  }else{
   app.innerHTML=`<div class="scr" style="--c:var(--${g.fan})">${head}${stage}<div class="opts c${q.cols||2}" id="opts">${q.opts.map((o,i)=>`<button class="opt ${q.optCls||""}" data-i="${i}">${o&&o.h?o.h:esc(o)}</button>`).join("")}</div></div>`;
   const bs=[...app.querySelectorAll(".opt")];let lock=false;
   bs.forEach(b=>b.onclick=()=>{if(lock)return;lock=true;const i=+b.dataset.i,ok=i===q.ans;
    bs.forEach((x,j)=>{if(j===q.ans)x.classList.add("ok");else if(j===i)x.classList.add("no");else x.classList.add("dim")});
    finish(ok)});
  }
  if($("#say")){$("#say").onclick=()=>say(q.say)}
  $("#x").onclick=()=>{save();adv?home():list(g.fan)};
  function finish(ok,showAns){
   const h=$("#hint");
   if(ok){fx.ok();h.className="hint g";h.textContent=one(["To'g'ri! 🎉","Barakalla! ⭐","Zo'r! 👏","Ofarin! 🌟"]);if(q.say)say(q.say)}
   else{fx.no();h.className="hint";h.textContent="Mana to'g'ri javob. Yana urinib ko'ramiz!";showAns&&showAns()}
   if(cur.first){mark(g,cur.it,ok);if(!ok){miss++;wrong.push(cur.it.id)}}
   if(!ok&&cur.first)queue.splice(Math.min(queue.length,pos+3),0,{it:cur.it,first:false});
   pos++;setTimeout(next,ok?850:1900)}
 }
 next();
}
function memory(g,L){
 const q=g.make(null,L),cards=sh(q.pairs.flatMap((p,i)=>[{k:i,v:p[0]},{k:i,v:p[1]}]));
 let open=[],found=0,tries=0,lock=false;
 const face=v=>typeof v==="string"?[v,""]:v.t?[v.t,""]:v.d?[v.d," d"]:[v.w," t"];
 app.innerHTML=`<div class="scr" style="--c:var(--man)"><div class="top"><button class="back" id="x">✕</button><span>Juftini top</span><span style="width:48px;text-align:center;font-size:26px">${g.e}</span></div>
  <div class="stage"><div class="mem c${q.cols}">${cards.map((c,i)=>`<button class="card${face(c.v)[1]}" data-i="${i}">${esc(face(c.v)[0])}</button>`).join("")}</div></div><div class="hint" id="hint"></div></div>`;
 $("#x").onclick=()=>adv?home():list(g.fan);
 const bs=[...app.querySelectorAll(".card")];
 bs.forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(lock||b.classList.contains("up")||b.classList.contains("done"))return;fx.tap();b.classList.add("up");open.push(i);
  if(open.length<2)return;tries++;lock=true;const[a,c]=open;open=[];
  if(cards[a].k===cards[c].k){fx.ok();setTimeout(()=>{[a,c].forEach(j=>{bs[j].classList.remove("up");bs[j].classList.add("done")});lock=false;
    if(++found===q.pairs.length){const extra=tries-q.pairs.length;const miss=extra<=2?0:extra<=5?2:4;const st=S.st[g.id]=S.st[g.id]||[0,0];st[1]+=tries;st[0]+=q.pairs.length;setTimeout(()=>result(g,L,miss,0),500)}},350)}
  else{setTimeout(()=>{[a,c].forEach(j=>bs[j].classList.remove("up"));lock=false},900)}});
}

/* ---------- natija ---------- */
function result(g,L,miss,total,wrong){
 const stars=miss===0?3:miss<=2?2:1;S.stars+=stars;
 const t=today();S.days[t]=(S.days[t]||0)+1;
 const lv=S.lv[g.id]||[1,0];let up=false;
 if(miss<=1){lv[1]++;if(lv[1]>=2&&lv[0]<g.lv){lv[0]++;lv[1]=0;up=true}}else if(miss>=4&&lv[0]>1){lv[0]--;lv[1]=0}else lv[1]=0;
 S.lv[g.id]=lv;
 let advDone=false;
 if(adv){const a=advState();a.n=Math.max(a.n,adv.i+1);adv.i++;
  if(a.n>=3&&S.last!==t){S.streak=S.last===t-1?S.streak+1:1;S.last=t;advDone=true}}
 save();fx.win();confetti();
 report("round",{game:g.n,fan:FAN[g.fan][0],level:L,got:stars,miss,total,wrong:(wrong||[]).join(", "),adv:advDone?1:0});
 const msg=up?`Yangi bosqich ochildi: ${lv[0]}-bosqich! 🚀`:miss===0?"Birorta ham xato yo'q!":miss<=2?"Juda yaxshi! Xatolarni ertaga yana ko'ramiz.":"Yaxshi harakat! Bu o'yinni yana mashq qilamiz.";
 const more=adv&&adv.i<3;
 app.innerHTML=`<div class="scr res"><div class="stars">${[1,2,3].map(i=>`<i class="${i<=stars?"on":""}">⭐</i>`).join("")}</div>
  <div class="h1">${one(["Barakalla!","Ofarin!","Zo'r!","Qoyil!"])}</div><div class="bunny">${CFG.mascot}</div>
  <div class="bub c">${msg}${advDone?"<br>Bugungi sarguzasht tugadi! 🎉":""}</div>
  ${more?`<button class="big g" id="nx">Keyingi o'yin →</button>`:`<button class="big g" id="hm">${advDone?"Ertaga ko'rishamiz 👋":"Bosh sahifa"}</button><button class="big w" id="ag" style="margin-top:14px;font-size:20px;padding:14px">🔁 Yana o'ynash</button>`}</div>`;
 if(more)$("#nx").onclick=()=>play(adv.list[adv.i]);
 else{$("#hm").onclick=home;$("#ag").onclick=()=>{adv=null;play(g.id)}}
}
function confetti(){const c=document.createElement("div");c.className="conf";
 for(let i=0;i<22;i++){const e=document.createElement("i");e.textContent=one(["⭐","🎉","🥕","✨","🌸"]);e.style.left=rnd(100)+"%";e.style.animationDuration=(1.6+Math.random()*1.6)+"s";e.style.animationDelay=Math.random()*.5+"s";c.appendChild(e)}
 document.body.appendChild(c);setTimeout(()=>c.remove(),3800)}

/* ---------- kattalar uchun ---------- */
function parent(){
 const t=today(),wd=["Ya","Du","Se","Cho","Pa","Ju","Sha"];
 const wk=Array.from({length:7},(_,i)=>{const d=t-6+i;return{n:S.days[d]||0,l:wd[new Date(d*864e5).getUTCDay()]}}),mx=Math.max(3,...wk.map(w=>w.n));
 const fans=Object.keys(FAN).map(f=>{let ok=0,all=0;G.filter(g=>g.fan===f).forEach(g=>{const s=S.st[g.id];if(s){ok+=s[0];all+=s[1]}});return[f,ok,all]});
 const hard=Object.entries(S.box).filter(([k,b])=>b[2]&&b[0]<3).sort((a,b)=>b[1][2]-a[1][2]).slice(0,12);
 const known=Object.values(S.box).filter(b=>b[0]>=3).length;
 app.innerHTML=`<div class="scr pr"><div class="top"><button class="back" id="bk">←</button><span style="font-size:20px">Hisobot</span><span style="width:48px"></span></div>
  <h2>Oxirgi 7 kun (o'ynalgan o'yinlar)</h2><div class="box"><div class="week">${wk.map(w=>`<div><span>${w.n||""}</span><i style="height:${w.n/mx*70}px"></i>${w.l}</div>`).join("")}</div></div>
  <h2>Umumiy</h2><div class="box"><div class="kv"><span>Yulduzlar</span><b>⭐ ${S.stars}</b></div><div class="kv"><span>Ketma-ket kunlar</span><b>🔥 ${S.streak}</b></div><div class="kv"><span>Mustahkam biladi (3-quti)</span><b>${known} ta</b></div></div>
  <h2>Fanlar bo'yicha to'g'ri javoblar</h2><div class="box">${fans.map(([f,ok,all])=>`<div class="kv"><span>${FAN[f][1]} ${FAN[f][0]}</span><b>${all?Math.round(ok/all*100)+"% · "+all+" savol":"—"}</b></div>`).join("")}</div>
  <h2>Qiynalyapti</h2><div class="box">${hard.length?hard.map(([k,b])=>{const[g,id]=k.split(/:(.*)/);return`<span class="tag">${GM[g]?GM[g].e:""} ${esc(id)} · ${b[2]}×</span>`}).join(""):"Hozircha xato yo'q yoki hammasi tuzatilgan 👍"}</div>
  <h2>Bosqichlar</h2><div class="box">${G.map(g=>`<div class="kv"><span>${g.e} ${esc(g.n)}</span><b>${level(g)} / ${g.lv}</b></div>`).join("")}</div>
  <h2>Bolaning ismi</h2><input id="nm" value="${esc(S.name)}" maxlength="20">
  <button class="lnk" id="rs">Hamma natijalarni o'chirish</button></div>`;
 $("#bk").onclick=()=>{const v=$("#nm").value.trim();if(v)S.name=v;save();home()};
 $("#rs").onclick=()=>{if(confirm("Hamma yulduz va natijalar o'chadi. Davom etilsinmi?")){const n=S.name;S={v:1,name:n,stars:0,streak:0,last:0,adv:{d:0,n:0},days:{},lv:{},box:{},st:{}};save();home()}};
}

/* ============ ISHGA TUSHIRISH ============ */
try{if(tg){tg.ready();tg.expand();tg.setHeaderColor&&tg.setHeaderColor("#FFF6E5");tg.setBackgroundColor&&tg.setBackgroundColor("#FFF6E5");tg.disableVerticalSwipes&&tg.disableVerticalSwipes()}}catch(e){}
app.innerHTML=`<div class="scr res"><div class="bunny">${CFG.mascot}</div></div>`;
load(()=>{home();report("open")});
window.__zukko={G,GM,S:()=>S,play,home,parent,level};
</script>
</body>
